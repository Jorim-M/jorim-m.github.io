<title>Endless Archive VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Chivo+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed A-Frame scene; an entry card over it, then a thin desktop HUD. Single dark look, deliberately. */
:root{
  --ground:#0f0d0b; --ink:#f2efe9; --dim:#b3ab9f; --panel:rgba(18,15,12,.86);
  --line:rgba(242,239,233,.22); --start:#f6b48e;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono:"Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink)}
body{font-family:var(--mono);font-size:13px}
#entry{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#entry .in{max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
#entry .eb{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
#entry h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,84px);line-height:.95;letter-spacing:-.03em;margin:0;text-wrap:balance}
#entry .sub{font:500 17px var(--display);color:var(--start)}
#entry .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#entry button{font:500 13px var(--mono);letter-spacing:.18em;text-transform:uppercase;border-radius:999px;padding:15px 28px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
#entry button.pri{background:var(--ink);color:#0c0b0a;border-color:var(--ink)}
#entry button:hover:not(:disabled){border-color:var(--start)}
#entry button.pri:hover:not(:disabled){background:var(--start)}
#entry button:disabled{opacity:.4;cursor:default}
#entry button:focus-visible{outline:2px solid var(--start);outline-offset:3px}
#entry .note{color:var(--dim);font-size:12px;line-height:1.6;max-width:46ch}
#entry .bar{width:min(280px,70vw);height:1px;background:rgba(242,239,233,.16)}
#entry .bar i{display:block;height:100%;background:var(--start);transform:scaleX(0);transform-origin:0 50%}
#hud{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;pointer-events:none;color:var(--dim);font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:5}
#hud b{color:var(--start);font-weight:500}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>

<div id="entry" role="dialog" aria-label="Fragments of Memory, VR">
  <div class="in">
    <div class="eb">An endless archive · VR edition</div>
    <h1>Fragments of Memory</h1>
    <div class="sub">Photographs by Mo Amin</div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="eb" id="status">Loading the archive</div>
    <div class="row">
      <button class="pri" id="go-vr" type="button" disabled>Enter VR</button>
      <button id="go-desk" type="button" disabled>Explore on desktop</button>
    </div>
    <p class="note" id="xrnote">Open this page in the Meta Quest browser to enter VR.</p>
  </div>
</div>
<div id="hud" hidden><span>WASD to walk · drag to look · Q / E to turn · click a caption or photo · V for the model</span><span><span id="lap">Lap <b>0</b></span> · <span id="range"></span> · <span id="mem"></span></span></div>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-master.min.js"></script>
<script>
// Endless Archive, A-Frame edition. The gallery (rooms, baked light, plates, streaming, seam) is the same code
// as the desktop version, run inside one A-Frame component; this file adds the Quest rig and controls.
AFRAME.registerComponent('archive', {
  init(){
    const sceneEl = this.el;
    const boot = () => {
      // keep the desktop version's colour handling: hex colours and vertex colours as written, sRGB textures decoded
      THREE.ColorManagement.enabled = false;
      sceneEl.renderer.outputColorSpace = THREE.SRGBColorSpace;
      this.api = build(sceneEl);
      window.ARCHIVE = this.api.debug;
      entry(this.api, sceneEl);
    };
    if (sceneEl.hasLoaded) boot(); else sceneEl.addEventListener('loaded', boot);
  },
  tick(){ if (this.api) this.api.tick(); }
});
function build(sceneEl){
const V = THREE.Vector3;
// ================= plan =================
const CH = 4.2, R = 4.2, H = 6, WT = 0.2, EYE = 1.65, RAD = 0.35, SR = 0.15, ST = 0.3;
const T = new V(H, H, H);            // lap offset: one storey up, parallel to the isometric view direction
const ROOMS = {
  r1:  {x:[0,9],    z:[6,13],    y:0, intro:'N'},   // welcome room: charcoal title wall on the visitor's left
  r2:  {x:[9,17],   z:[6,13],    y:0},
  hall:{x:[11,15],  z:[-9,6],    y:0, hall:true},
  r4:  {x:[9,17],   z:[-16,-9],  y:R, dark:true},
  r5:  {x:[-3,9],   z:[-16,-9],  y:R, dark:true},
  r6:  {x:[-11,-3], z:[-16,-9],  y:R},
  r7:  {x:[-11,-4], z:[-9,1.5],  y:R+0.6},
  r8:  {x:[-11,-4], z:[1.5,12],  y:R+1.2},
  r9:  {x:[-11,-3], z:[12,19],   y:H},
  r10: {x:[-3,6],   z:[12,19],   y:H},
};
const KEYS = Object.keys(ROOMS);
const DOORS = [
  {a:'r1', b:'r2', wall:'x', at:9, c:9.5, w:2.4},
  {a:'r2', b:'hall', wall:'z', at:6, c:13, w:3.6, h:3.4},
  {a:'hall', b:'r4', wall:'z', at:-9, c:13, w:3.6, h:3.4},
  {a:'r4', b:'r5', wall:'x', at:9, c:-12.5, w:2.4},
  {a:'r5', b:'r6', wall:'x', at:-3, c:-12.5, w:2.4},
  {a:'r6', b:'r7', wall:'z', at:-9, c:-7.5, w:2.4},
  {a:'r7', b:'r8', wall:'z', at:1.5, c:-7.5, w:2.4},
  {a:'r8', b:'r9', wall:'z', at:12, c:-7.5, w:2.4},
  {a:'r9', b:'r10', wall:'x', at:-3, c:15.5, w:2.4},
  {a:'r10', b:'r1', wall:'x', at:6, c:15.5, w:2.4, shift:true},   // the seam
];
const WINDOWS = [
  {room:'r1', side:'S', c:4.5, w:4.8, sill:0.7, h:2.8},
  {room:'r8', side:'W', c:6.75, w:5.5, sill:0.7, h:2.8},
  {room:'r9', side:'S', c:-7, w:3.6, sill:0.7, h:2.8},
];
// stair hall section along z
const HZ_TOP = 2.9, HSTEPS = 21, HT = 0.3, HR = R/HSTEPS, HZ_BOT = HZ_TOP - HSTEPS*HT;
// stair hall: four tall slot windows that step up with the stair, each sill a fixed height above its tread
for (const c of [1.9, 0.3, -1.3, -2.9]){
  const tread = R*Math.min(1, Math.max(0, (HZ_TOP - c)/(HZ_TOP - HZ_BOT)));
  WINDOWS.push({room:'hall', side:'E', c, w:0.95, sill:tread + 1.0, h:2.9});
}
const hallFloorAt = z => z >= HZ_TOP ? 0 : z <= HZ_BOT ? R : HR*Math.min(HSTEPS, Math.ceil((HZ_TOP - z)/HT - 1e-6));
const ceilOf = k => ROOMS[k].hall ? R + CH : ROOMS[k].y + CH;
const inner = k => { const r = ROOMS[k]; return {x0:r.x[0]+WT, x1:r.x[1]-WT, z0:r.z[0]+WT, z1:r.z[1]-WT}; };
function sideGeo(rc, side){
  switch(side){
    case 'W': return {s0:rc.z0, s1:rc.z1, n:new V(1,0,0),  at:(d,s)=>[rc.x0+d, s]};
    case 'E': return {s0:rc.z0, s1:rc.z1, n:new V(-1,0,0), at:(d,s)=>[rc.x1-d, s]};
    case 'N': return {s0:rc.x0, s1:rc.x1, n:new V(0,0,1),  at:(d,s)=>[s, rc.z0+d]};
    case 'S': return {s0:rc.x0, s1:rc.x1, n:new V(0,0,-1), at:(d,s)=>[s, rc.z1-d]};
  }
}
function sideOf(k, wall, at){
  const r = ROOMS[k], e = 1e-6;
  if (wall === 'x') return Math.abs(r.x[1]-at)<e ? 'E' : Math.abs(r.x[0]-at)<e ? 'W' : null;
  return Math.abs(r.z[1]-at)<e ? 'S' : Math.abs(r.z[0]-at)<e ? 'N' : null;
}
const baseFloor = (k, wall, at) => ROOMS[k].hall ? hallFloorAt(at > 0 ? at - 0.3 : at + 0.3) : ROOMS[k].y;

const OPEN = {}, STOOPS = {};
KEYS.forEach(k => { OPEN[k] = {W:[],E:[],N:[],S:[]}; STOOPS[k] = []; });
for (const d of DOORS){
  const sx = d.shift ? (d.wall==='x' ? T.x : T.z) : 0, sc = d.shift ? (d.wall==='x' ? T.z : T.x) : 0, sy = d.shift ? T.y : 0;
  const fa = baseFloor(d.a, d.wall, d.at), fb = baseFloor(d.b, d.wall, d.at - sx) + sy;
  d.df = Math.max(fa, fb); d.h = d.h || 3.0; d.sy = sy;
  const sa = sideOf(d.a, d.wall, d.at), sb = sideOf(d.b, d.wall, d.at - sx);
  OPEN[d.a][sa].push({c:d.c, w:d.w, sill:d.df-fa, top:d.df-fa+d.h, y0:d.df, y1:d.df+d.h});
  OPEN[d.b][sb].push({c:d.c - sc, w:d.w, sill:d.df-fb, top:d.df-fb+d.h, y0:d.df-sy, y1:d.df-sy+d.h});
  if (!ROOMS[d.a].hall && d.df-fa > 0.01) STOOPS[d.a].push({side:sa, n:Math.round((d.df-fa)/SR)});
  if (!ROOMS[d.b].hall && d.df-fb > 0.01) STOOPS[d.b].push({side:sb, n:Math.round((d.df-fb)/SR)});
}
function floorAt(k, x, z){
  const r = ROOMS[k]; if (r.hall) return hallFloorAt(z);
  let y = r.y; const rc = inner(k);
  for (const s of STOOPS[k]){
    const dist = s.side==='W' ? x-rc.x0 : s.side==='E' ? rc.x1-x : s.side==='N' ? z-rc.z0 : rc.z1-z;
    if (dist < s.n*ST) y = Math.max(y, r.y + SR*(s.n - Math.floor(Math.max(0,dist)/ST)));
  }
  return y;
}

// ================= plate slots (salon hang) =================
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const SIZES = [[0.9,0.68],[1.15,0.86],[0.68,0.88],[1.4,1.0],[0.78,0.6],[1.0,0.75],[0.62,0.92]];
const FW = 0.045, FD = 0.045;   // moulding width and depth
// caption plaques: three shapes, matching regions of one texture atlas
const LABELS = [{w:0.075, h:0.095, a:[0,0,96,120]}, {w:0.13, h:0.085, a:[112,0,272,104]}, {w:0.062, h:0.12, a:[288,0,352,128]}];
const hallStairY = z => z >= HZ_TOP ? 0 : z <= HZ_BOT ? R : R*(HZ_TOP - z)/(HZ_TOP - HZ_BOT);
const slots = [];
KEYS.forEach((k, ki) => {
  const rc = inner(k), r = ROOMS[k];
  ['W','E','N','S'].forEach((side, si) => {
    if (r.hall && (side === 'N' || side === 'S')) return;
    if (STOOPS[k].some(s => s.side === side)) return;
    if (r.intro === side) return;
    const g = sideGeo(rc, side);
    const floorY = s => r.hall ? hallStairY(s) : r.y;    // hall walls run along z, so s is z there
    const blocks = [[g.s0-1, g.s0+0.6],[g.s1-0.6, g.s1+1]];
    for (const o of OPEN[k][side]) blocks.push([o.c-o.w/2-0.45, o.c+o.w/2+0.45]);
    for (const w of WINDOWS) if (w.room===k && w.side===side) blocks.push([w.c-w.w/2-0.35, w.c+w.w/2+0.35]);
    for (const s of STOOPS[k]){
      const run = s.n*ST + 0.6;
      if ((side==='W'||side==='E') && s.side==='N') blocks.push([rc.z0-1, rc.z0+run]);
      if ((side==='W'||side==='E') && s.side==='S') blocks.push([rc.z1-run, rc.z1+1]);
      if ((side==='N'||side==='S') && s.side==='W') blocks.push([rc.x0-1, rc.x0+run]);
      if ((side==='N'||side==='S') && s.side==='E') blocks.push([rc.x1-run, rc.x1+1]);
    }
    blocks.sort((a,b) => a[0]-b[0]);
    let cur = g.s0; const free = [];
    for (const [b0,b1] of blocks){ if (b0 > cur) free.push([cur,b0]); cur = Math.max(cur,b1); }
    if (cur < g.s1) free.push([cur, g.s1]);
    const rnd = rng(1000 + ki*17 + si*5);
    for (const [f0,f1] of free){
      const L = f1-f0; if (L < 0.9) continue;
      const items = []; let used = 0;
      for (let tries=0; tries<14; tries++){
        const roll = rnd();
        let kind = roll < 0.1 ? 'print' : roll < 0.22 ? 'diptych' : roll < 0.47 ? 'bleed' : 'framed';
        if (r.hall && kind === 'print') kind = 'framed';
        let [w,h] = kind==='print' ? [1.5,1.1] : kind==='diptych' ? [1.2,0.62] : SIZES[rnd()*SIZES.length|0];
        if (r.hall){ w *= 0.85; h *= 0.85; }
        const ow = kind==='print' ? w : w + 2*FW;
        const lab = LABELS[kind==='print' || ow > 1.1 ? (rnd()<0.6 ? 1 : 0) : (rnd()*3|0)];
        const lroll = rnd(), mode = r.hall ? (lroll < 0.5 ? 'below' : 'rightBottom') : lroll < 0.4 ? 'below' : lroll < 0.75 ? 'rightBottom' : 'rightMid';
        const ext = mode === 'below' ? 0 : 0.07 + lab.w;
        const gap = items.length ? 0.4 + rnd()*0.35 : 0;
        if (used + gap + ow + ext > L){ if (items.length) break; continue; }
        items.push({kind,w,h,ow,gap,ext,lab,mode}); used += gap + ow + ext;
      }
      let sp = f0 + (L-used)/2;
      for (const it of items){
        sp += it.gap; const sc = sp + it.ow/2; sp += it.ow + it.ext;
        const oh = it.kind==='print' ? it.h : it.h + 2*FW;
        const fy = floorY(sc);
        let cy = r.hall ? 1.6 + (rnd()-0.5)*0.2 : it.kind==='print' ? 1.55 + rnd()*0.15 : 1.5 + (rnd()-0.45)*0.55;
        cy = Math.min(2.75 - oh/2, Math.max(0.95 + oh/2, cy));
        const [x,z] = g.at(0, sc), off = it.kind==='print' ? 0.027 : 0.032;
        slots.push({room:k, kind:it.kind, w:it.w, h:it.h, ow:it.ow, oh, lab:it.lab, mode:it.mode,
          wall:new V(x, fy + cy, z), pos:new V(x + g.n.x*off, fy + cy, z + g.n.z*off),
          rotY:Math.atan2(g.n.x, g.n.z), facing:g.n.clone()});
      }
    }
  });
});
const N = slots.length;
slots.forEach(sl => sl.geo = new THREE.PlaneGeometry(sl.w, sl.h));

// ================= baked lights =================
const SKY = [0.95,0.97,1.0], WARM = [1.0,0.80,0.58], WIN = [1.0,0.9,0.76];
const LIGHTS = {}; KEYS.forEach(k => LIGHTS[k] = []);
const skylights = [];
for (const k of KEYS){
  if (ROOMS[k].dark) continue;   // the dark room has no daylight, only track lights
  const rc = inner(k), cy = ceilOf(k) - 0.05;
  const centers = ROOMS[k].hall ? [[13, 2.6],[13,-5.8]] : [[(rc.x0+rc.x1)/2, (rc.z0+rc.z1)/2]];
  const sx = ROOMS[k].hall ? 2.4 : Math.min(3.6, (rc.x1-rc.x0)*0.42), sz = ROOMS[k].hall ? 2.4 : Math.min(3.6, (rc.z1-rc.z0)*0.42);
  const pow = ROOMS[k].hall ? 6 : 5.5;
  for (const [cx,cz] of centers){
    skylights.push({room:k, c:new V(cx,cy,cz), sx, sz});
    for (const a of [-1,1]) for (const b of [-1,1])
      LIGHTS[k].push({p:new V(cx + a*sx/4, cy, cz + b*sz/4), dir:new V(0,-1,0), pow, col:SKY, sq:true});
  }
}
for (const w of WINDOWS){
  const g = sideGeo(inner(w.room), w.side), y0 = ROOMS[w.room].y;
  for (const i of [-1,0,1]) for (const f of [0.3,0.75]){
    const [x,z] = g.at(0.15, w.c + i*w.w/3);
    LIGHTS[w.room].push({p:new V(x, y0 + w.sill + w.h*f, z), dir:g.n.clone().add(new V(0,-0.25,0)).normalize(), pow:1.6, col:WIN, sq:false});
  }
}
const TRACKS = [];
// two warm wall-washers on the title wall
{ const rc = inner('r1');
  for (const x of [2.6, 6.4]) LIGHTS.r1.push({p:new V(x, CH-0.3, rc.z0+1.6), dir:new V(0,-0.55,-1).normalize(), pow:7, col:WARM, spot:true, sq:true}); }
for (const sl of slots){
  if (ROOMS[sl.room].dark){
    const lp = sl.pos.clone().addScaledVector(sl.facing, 1.5); lp.y = ceilOf(sl.room) - 0.3;
    LIGHTS[sl.room].push({p:lp, dir:sl.pos.clone().sub(lp).normalize(), pow:30, col:WARM, spot:true, tight:true});
    TRACKS.push({p:lp, dir:sl.pos.clone().sub(lp).normalize()});
  } else {
    const lp = sl.pos.clone().addScaledVector(sl.facing, 0.75).add(new V(0,0.95,0));
    LIGHTS[sl.room].push({p:lp, dir:sl.pos.clone().sub(lp).normalize(), pow:1.25, col:WARM, sq:true, spot:true});
  }
}
let MOOD = {amb:0.10};
const EXPO = 0.85;
function shade(p, n, list, alb, ao, bounceMul){
  let r=0,g=0,b=0,bounce=0;
  for (const L of list){
    const vx=L.p.x-p.x, vy=L.p.y-p.y, vz=L.p.z-p.z, d2=vx*vx+vy*vy+vz*vz, d=Math.sqrt(d2);
    if (!L.spot) bounce += L.pow/(4+d2);
    const cr = (n.x*vx+n.y*vy+n.z*vz)/d; if (cr <= 0) continue;
    let cl = -(L.dir.x*vx+L.dir.y*vy+L.dir.z*vz)/d; if (cl <= 0) continue;
    if (L.tight) cl = Math.pow(cl, 20); else { if (L.sq) cl *= cl; if (L.spot) cl *= cl; }
    const e = L.pow*cr*cl/(d2+0.25);
    r += e*L.col[0]; g += e*L.col[1]; b += e*L.col[2];
  }
  const amb = MOOD.amb + 0.05*bounce*bounceMul;
  r = (r + amb)*ao; g = (g + amb*0.95)*ao; b = (b + amb*0.88)*ao;
  return [1-Math.exp(-alb[0]*r*EXPO), 1-Math.exp(-alb[1]*g*EXPO), 1-Math.exp(-alb[2]*b*EXPO)];
}

// ================= walk geometry =================
function Buf(){ return {pos:[], col:[], uv:[], idx:[]}; }
const gF = Buf(), gW = Buf(), gC = Buf(), gSky = Buf(), gShaft = Buf();
function patch(buf, P, nu, nv, fn){
  const base = buf.pos.length/3;
  for (let iv=0; iv<=nv; iv++) for (let iu=0; iu<=nu; iu++){
    const u = iu/nu, v = iv/nv, p = P(u,v), o = fn(p,u,v);
    buf.pos.push(p.x,p.y,p.z); buf.col.push(...o.c); if (o.uv) buf.uv.push(...o.uv);
  }
  for (let iv=0; iv<nv; iv++) for (let iu=0; iu<nu; iu++){
    const a = base + iv*(nu+1) + iu, b = a+1, c = a+nu+1, d = c+1;
    buf.idx.push(a,b,d, a,d,c);
  }
}
const WALL = [0.80,0.74,0.64], CEIL = [0.60,0.56,0.50], RISER = [0.42,0.36,0.30], ONE = [1,1,1];
const UVS = 1/3; // 3 m floor tile; T is a whole number of tiles so the seam matches
const aoE = (dist, k=0.45, amt=0.45) => 1 - amt*Math.exp(-Math.max(0,dist)/k);
const UP = new V(0,1,0), DOWN = new V(0,-1,0);
const seg = (n,len) => Math.max(1, Math.ceil(len/n));
// horizontal rect (floor or tread)
function hRect(buf, x0,x1,z0,z1,y, list, opts={}){
  const nrm = opts.down ? DOWN : UP, rc = opts.rc;
  patch(buf, (u,v) => new V(x0+(x1-x0)*u, y, z0+(z1-z0)*v), seg(0.5,x1-x0), seg(0.5,z1-z0), p => {
    const edge = rc ? Math.min(p.x-rc.x0, rc.x1-p.x, p.z-rc.z0, rc.z1-p.z) : 9;
    return {c:shade(p, nrm, list, opts.alb||ONE, aoE(edge, 0.5, opts.down?0.3:0.4), opts.down?2.2:1), uv: opts.down ? null : [p.x*UVS, p.z*UVS]};
  });
}
// vertical rect given two ground points and y range
function vRect(buf, ax,az,bx,bz, y0,y1, nrm, list, alb, floorY, ceilY){
  const len = Math.hypot(bx-ax, bz-az);
